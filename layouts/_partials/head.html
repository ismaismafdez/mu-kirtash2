<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{- $title := cond .IsHome (printf "%s · Guías de MU Online" site.Title) (printf "%s · %s" .Title site.Title) }}
{{- $desc := .Description | default site.Params.description }}
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}">
<meta name="theme-color" content="#06080d">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
{{- with .Params.image.src }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 9 30 24 24 39 18 24Z' fill='%23d4aa55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
{{- $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
