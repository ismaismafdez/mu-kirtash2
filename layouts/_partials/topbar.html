<header class="topbar">
  {{ partial "brand.html" (dict "class" "topbar-brand" "label" (printf "%s, inicio" site.Title)) }}
  <div class="search" role="search">
    <label class="sr-only" for="search">Buscar en {{ site.Title }}</label>
    {{ partial "icon.html" (dict "name" "search" "class" "i-search") }}
    <input id="search" type="search" placeholder="Buscar guías, personajes, mapas, items…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="search-clear" id="search-clear" type="button" aria-label="Borrar búsqueda" hidden>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <kbd aria-hidden="true">/</kbd>
  </div>
  <label class="sr-only" for="season-select">Season</label>
  <select id="season-select" class="season-select">
    {{- range hugo.Data.seasons }}
    <option value="{{ .id }}"{{ if eq .id site.Params.defaultSeason }} selected{{ end }}>{{ .label }}</option>
    {{- end }}
  </select>
</header>
