<a class="brand{{ with .class }} {{ . }}{{ end }}" href="{{ "/" | relURL }}"{{ with .label }} aria-label="{{ . }}"{{ end }}>
  <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M24 9 30 24 24 39 18 24Z" fill="currentColor" fill-opacity=".22"/>
      <path d="M17 22C13 15 8 12 2 12c4 3 6 6 7 10-3 0-5 1-6 3 5 1 10 0 14-3Z"/>
      <path d="M31 22c4-7 9-10 15-10-4 3-6 6-7 10 3 0 5 1 6 3-5 1-10 0-14-3Z"/>
      <path d="M18 29c-3 2-6 5-7 9 4-1 7-3 9-6M30 29c3 2 6 5 7 9-4-1-7-3-9-6"/>
    </g>
  </svg>
  <span><span class="brand-name">{{ site.Title }}</span><span class="brand-sub">{{ site.Params.subtitle }}</span></span>
</a>
