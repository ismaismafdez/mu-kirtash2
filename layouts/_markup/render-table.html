{{- /* Tablas Markdown: contenedor con scroll en móvil y "Pendiente" atenuado */ -}}
<div class="table-wrap" tabindex="0" role="region" aria-label="Tabla de datos">
  <table>
    <thead>
      {{- range .THead }}<tr>{{ range . }}<th scope="col"{{ with .Alignment }} style="text-align:{{ . | safeCSS }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end }}
    </thead>
    <tbody>
      {{- range .TBody }}<tr>{{ range . }}{{ $t := .Text | plainify | strings.TrimSpace }}<td{{ if eq $t "Pendiente" }} class="is-pending"{{ end }}{{ with .Alignment }} style="text-align:{{ . | safeCSS }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end }}
    </tbody>
  </table>
</div>
